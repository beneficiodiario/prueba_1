    <!-- Sin media query: lo gestiona el script de tema de abajo, que es
         quien conoce la preferencia guardada por el usuario. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Tema antes del primer pintado: evita el destello blanco a quien
         navega en modo noche. Va en línea y sin defer a propósito. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bd_dark');
          var dark = saved === '1' ? true
                   : saved === '0' ? false
                   : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#080c18' : '#ffffff');
        } catch (e) { /* almacenamiento bloqueado: se queda en claro */ }
      })();
    </script>

    <!-- ══════════════════ RENDIMIENTO (preconnect / dns-prefetch) ══════════════════ -->
